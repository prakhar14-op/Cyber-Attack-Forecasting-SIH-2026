# Day-wise splits (M1.5) — whole attack episodes stay inside one split.
# Days fixed by docs/decisions/001-feature-source.md. Never split randomly.
#
# The assignment also applies generalisation pressure: train carries
# bruteforce + DoS, validation sees infiltration, test sees bot C2 —
# families the model never trained on (complements the M4.6 holdout mode).
train:
  - "2018-02-14"   # FTP/SSH bruteforce
  - "2018-02-16"   # DoS Hulk / SlowHTTPTest
val:
  - "2018-02-28"   # Infiltration
test:
  - "2018-03-02"   # Bot
