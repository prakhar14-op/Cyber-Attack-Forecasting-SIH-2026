<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" width="1180" height="470"
     font-family="'Segoe UI', Arial, Helvetica, sans-serif"
     role="img" aria-labelledby="fig1-title fig1-desc">
  <title id="fig1-title">Data flow: what ships in the deployed engine versus what is evaluation-only</title>
  <desc id="fig1-desc">PCAP or CSV input is parsed by a streaming extractor into thirty named,
    window-bounded features. That one matrix feeds two lanes. The deployed lane (solid outline)
    is a single XGBoost model, a threshold fitted from a validation false-positive budget,
    TreeSHAP named-feature explanations with an ATT and CK technique, and an append-only
    hash-chained ledger. The evaluation-only lane (dashed outline) is the TGN encoder, the GRAFT
    causal transformer, the k-step forecast head (a ranking result whose target is 93–96 %
    identical to the nowcast target) and the rank-mean fusion; none of it runs in
    engine/predict.py.</desc>

  <!-- Style is carried on presentation attributes, not a CSS block: GitHub's SVG sanitiser
       may drop <style>, and a figure whose meaning lives in stripped CSS is a figure that
       renders wrong on the page a judge actually opens. -->
  <rect width="1180" height="470" fill="#ffffff"/>

  <defs>
    <marker id="a-solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f3a5f"/>
    </marker>
    <marker id="a-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#333333"/>
    </marker>
  </defs>

  <text x="20" y="26" font-size="19" font-weight="700" fill="#0b2438">Figure 1 — Data flow: what ships in the engine, and what is evaluation-only</text>

  <!-- Legend. Outline STYLE carries the distinction, not hue, so it survives greyscale. -->
  <g font-size="11.5" fill="#1a1a1a">
    <rect x="712" y="34" width="22" height="13" rx="2" fill="#a9cbe8" stroke="#0f3a5f" stroke-width="2"/>
    <text x="740" y="45">runs in the deployed engine</text>
    <rect x="925" y="34" width="22" height="13" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.8" stroke-dasharray="5 3"/>
    <text x="953" y="45">evaluation-side only</text>
  </g>

  <!-- shared front end: runs in engine/predict.py -->
  <g data-lane="deployed">
    <rect x="40" y="56" width="200" height="70" rx="5" fill="#a9cbe8" stroke="#0f3a5f" stroke-width="2"/>
    <text x="140" y="82" text-anchor="middle" font-size="14" font-weight="600" fill="#0b2438">PCAP / CSV</text>
    <text x="140" y="99" text-anchor="middle" font-size="11" fill="#2c4557">offline input file</text>
    <text x="140" y="114" text-anchor="middle" font-size="11" fill="#2c4557">CSV = flow features only</text>

    <path d="M 244 91 L 268 91" stroke="#0f3a5f" stroke-width="2" fill="none" marker-end="url(#a-solid)"/>

    <rect x="276" y="56" width="380" height="70" rx="5" fill="#a9cbe8" stroke="#0f3a5f" stroke-width="2"/>
    <text x="466" y="82" text-anchor="middle" font-size="14" font-weight="600" fill="#0b2438">Streaming packet extractor</text>
    <text x="466" y="99" text-anchor="middle" font-size="11" fill="#2c4557" font-family="Consolas, 'Courier New', monospace">data/packet_features.py</text>
    <text x="466" y="114" text-anchor="middle" font-size="11" fill="#2c4557">raw struct offsets, bounded memory, no whole-file load</text>

    <path d="M 660 91 L 684 91" stroke="#0f3a5f" stroke-width="2" fill="none" marker-end="url(#a-solid)"/>

    <rect x="692" y="56" width="448" height="70" rx="5" fill="#a9cbe8" stroke="#0f3a5f" stroke-width="2"/>
    <text x="916" y="82" text-anchor="middle" font-size="14" font-weight="600" fill="#0b2438">30 named, window-bounded features</text>
    <text x="916" y="99" text-anchor="middle" font-size="11" fill="#2c4557" font-family="Consolas, 'Courier New', monospace">data/windows.py</text>
    <text x="916" y="114" text-anchor="middle" font-size="11" fill="#2c4557">per (source host, 15 s window) — every value summarises only that window</text>
  </g>

  <!-- the one matrix forks into the two lanes -->
  <path d="M 916 130 L 916 152 L 22 152 L 22 365" stroke="#555555" stroke-width="1.6" fill="none"/>
  <path d="M 22 235 L 32 235" stroke="#555555" stroke-width="1.6" fill="none" marker-end="url(#a-solid)"/>
  <path d="M 22 365 L 32 365" stroke="#555555" stroke-width="1.6" fill="none" marker-end="url(#a-dash)"/>

  <!-- lane A: the deployed engine -->
  <g data-lane="deployed">
    <text x="52" y="180" data-claim="deployed-single-model" font-size="13" font-weight="700" fill="#0f3a5f">DEPLOYED ENGINE — engine/predict.py, a single XGBoost model (two variants by input format, not a cascade)</text>

    <rect x="40" y="198" width="248" height="74" rx="5" fill="#a9cbe8" stroke="#0f3a5f" stroke-width="2"/>
    <text x="164" y="224" text-anchor="middle" font-size="14" font-weight="600" fill="#0b2438">XGBoost scorer</text>
    <text x="164" y="241" text-anchor="middle" font-size="11" fill="#2c4557" font-family="Consolas, 'Courier New', monospace">engine/train_engine.py</text>
    <text x="164" y="256" text-anchor="middle" font-size="11" fill="#2c4557">PCAP: 30 features · CSV: flow-only</text>

    <path d="M 292 235 L 316 235" stroke="#0f3a5f" stroke-width="2" fill="none" marker-end="url(#a-solid)"/>

    <rect x="324" y="198" width="248" height="74" rx="5" fill="#a9cbe8" stroke="#0f3a5f" stroke-width="2"/>
    <text x="448" y="224" text-anchor="middle" font-size="14" font-weight="600" fill="#0b2438">Threshold, not a literal</text>
    <text x="448" y="241" text-anchor="middle" font-size="11" fill="#2c4557" font-family="Consolas, 'Courier New', monospace">engine/thresholds.py</text>
    <text x="448" y="256" text-anchor="middle" font-size="11" fill="#2c4557">fitted from an FPR budget on validation</text>

    <path d="M 576 235 L 600 235" stroke="#0f3a5f" stroke-width="2" fill="none" marker-end="url(#a-solid)"/>

    <rect x="608" y="198" width="248" height="74" rx="5" fill="#a9cbe8" stroke="#0f3a5f" stroke-width="2"/>
    <text x="732" y="224" text-anchor="middle" font-size="14" font-weight="600" fill="#0b2438">Explanation + stage rule</text>
    <text x="732" y="241" text-anchor="middle" font-size="11" fill="#2c4557" font-family="Consolas, 'Courier New', monospace">engine/explain.py</text>
    <text x="732" y="256" text-anchor="middle" font-size="11" fill="#2c4557">TreeSHAP over named features → ATT&amp;CK</text>

    <path d="M 860 235 L 884 235" stroke="#0f3a5f" stroke-width="2" fill="none" marker-end="url(#a-solid)"/>

    <rect x="892" y="198" width="248" height="74" rx="5" fill="#a9cbe8" stroke="#0f3a5f" stroke-width="2"/>
    <text x="1016" y="224" text-anchor="middle" font-size="14" font-weight="600" fill="#0b2438">Tamper-evident ledger</text>
    <text x="1016" y="241" text-anchor="middle" font-size="11" fill="#2c4557" font-family="Consolas, 'Courier New', monospace">ledger/verify_cli.py</text>
    <text x="1016" y="256" text-anchor="middle" font-size="11" fill="#2c4557">hash chain + Merkle root + anchor</text>
  </g>

  <!-- lane B: evaluation only -->
  <g data-lane="eval-only">
    <text x="52" y="310" font-size="13" font-weight="700" fill="#333333">EVALUATION-SIDE ONLY — none of this lane runs in engine/predict.py; engine-side fusion is roadmap</text>

    <rect x="40" y="328" width="248" height="80" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.8" stroke-dasharray="7 4"/>
    <text x="164" y="354" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a">TGN memory encoder</text>
    <text x="164" y="371" text-anchor="middle" font-size="11" fill="#444444" font-family="Consolas, 'Courier New', monospace">models/tgn.py</text>
    <text x="164" y="386" text-anchor="middle" font-size="11" fill="#444444">edges stamped at flow END (causality)</text>

    <path d="M 292 365 L 316 365" stroke="#333333" stroke-width="1.8" fill="none" marker-end="url(#a-dash)"/>

    <rect x="324" y="328" width="248" height="80" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.8" stroke-dasharray="7 4"/>
    <text x="448" y="354" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a">GRAFT causal transformer</text>
    <text x="448" y="371" text-anchor="middle" font-size="11" fill="#444444" font-family="Consolas, 'Courier New', monospace">models/graft.py</text>
    <text x="448" y="386" text-anchor="middle" font-size="11" fill="#444444">causal + padding mask, leak-pinned</text>

    <path d="M 576 365 L 600 365" stroke="#333333" stroke-width="1.8" fill="none" marker-end="url(#a-dash)"/>

    <rect x="608" y="328" width="248" height="80" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.8" stroke-dasharray="7 4"/>
    <text x="732" y="352" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a">k-step forecast head</text>
    <text x="732" y="368" text-anchor="middle" font-size="11" fill="#444444" font-family="Consolas, 'Courier New', monospace">eval/forecast.py</text>
    <g data-claim="kstep-ranking-only">
      <text x="732" y="382" text-anchor="middle" font-size="11" fill="#444444">labels shifted by k — a RANKING result</text>
      <text x="732" y="396" text-anchor="middle" font-size="10" fill="#444444">target 93–96 % identical to the nowcast target</text>
    </g>

    <path d="M 860 365 L 884 365" stroke="#333333" stroke-width="1.8" fill="none" marker-end="url(#a-dash)"/>

    <rect x="892" y="328" width="248" height="80" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.8" stroke-dasharray="7 4"/>
    <text x="1016" y="354" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a">Rank-mean fusion</text>
    <text x="1016" y="371" text-anchor="middle" font-size="11" fill="#444444" font-family="Consolas, 'Courier New', monospace">eval/fused.py</text>
    <text x="1016" y="386" data-claim="fusion-not-deployed" text-anchor="middle" font-size="10.5" fill="#444444">headline row — does not run in the engine</text>
  </g>

  <g font-size="11.5" fill="#333333">
    <text x="40" y="426">Identity: keyed-HMAC pseudonyms with a per-epoch permutation, role-only node features (data/anonymize.py) — no raw IP reaches either lane or the ledger.</text>
    <text x="40" y="446">Both lanes read the same 30-feature matrix. The headline AUROC in docs/architecture.md §4 is the fused, evaluation-side model; the engine scores with lane A alone.</text>
  </g>
</svg>
