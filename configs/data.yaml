# Data pipeline configuration.
# Every path, seed and hyper-parameter lives in configs/ — modules read this file
# through configs.loader.load_config and never hardcode a value.

seed: 1337

paths:
  # Raw captures live OUTSIDE the repo (and outside OneDrive sync — tens of GB).
  # Absolute on purpose; refetchable at any time, safe to delete.
  raw_dir: C:/sih26_data/raw
  interim_dir: C:/sih26_data/interim
  processed_dir: C:/sih26_data/processed
  artifacts_dir: artifacts          # persisted scalers/encoders live next to the weights
  scaler: artifacts/scaler.pkl
  feature_names: artifacts/feature_names.json
  splits: data/splits.yaml
  fixture_csv: tests/fixtures/mini.csv

dataset:
  name: cse-cic-ids2018
  s3_bucket: s3://cse-cic-ids2018
  s3_https_base: https://cse-cic-ids2018.s3.ca-central-1.amazonaws.com
  s3_prefix: "Processed Traffic Data for ML Algorithms"
  pcap_prefix: "Original Network Traffic and Log data"
  # Day set fixed by docs/decisions/001-feature-source.md (approved 2026-09-05).
  # Flow AND packet features for these days come from our own extractor over
  # selectively fetched per-host pcap members — never from the published CSVs
  # (feature parity across splits). 20-02 is fixture-only, not a model day.
  # (csv filenames are not derivable from dates — the bucket has typos like "Thuesday".)
  days:
    - date: "2018-02-14"
      csv: Wednesday-14-02-2018_TrafficForML_CICFlowMeter.csv
      pcap_dir: Wednesday-14-02-2018
      pcap_archive: pcap.zip
    - date: "2018-02-16"
      csv: Friday-16-02-2018_TrafficForML_CICFlowMeter.csv
      pcap_dir: Friday-16-02-2018
      pcap_archive: pcap.zip
    - date: "2018-02-28"
      csv: Wednesday-28-02-2018_TrafficForML_CICFlowMeter.csv
      pcap_dir: Wednesday-28-02-2018
      pcap_archive: pcap.zip
    - date: "2018-03-02"
      csv: Friday-02-03-2018_TrafficForML_CICFlowMeter.csv
      pcap_dir: Friday-02-03-2018
      pcap_archive: pcap.zip

  # Selective per-host fetch (decision 001): every member matching a timeline
  # attacker/victim IP, plus this many seed-sampled benign hosts per day.
  benign_hosts_per_day: 30
  host_sample_seed: 1337
  timeline: data/attack_timeline.yaml

windows:
  window_seconds: 15
  stride_seconds: 5
  max_sequence_windows: 48          # 4 min of context
  forecast_horizon_windows: 8       # K = 8 -> 40 s ahead

# The 7 stage classes. List order IS the label encoding — never reorder.
stages:
  - benign
  - recon
  - initial_access
  - lateral_movement
  - c2
  - exfiltration
  - impact

# Unit of prediction is (source_host, window); the network-level score is the max
# over host scores in the window.
prediction_unit: source_host_window
network_score_aggregation: max

schema:
  # canonical name -> raw CIC-IDS-2018 (CICFlowMeter) column.
  # The loader strips whitespace from raw headers before applying this mapping
  # and must survive repeated header rows, Inf/NaN rates and mixed timestamps (M1.2).
  timestamp: Timestamp
  src_ip: Src IP
  dst_ip: Dst IP
  src_port: Src Port
  dst_port: Dst Port
  protocol: Protocol
  duration: Flow Duration
  fwd_bytes: TotLen Fwd Pkts
  bwd_bytes: TotLen Bwd Pkts
  fwd_pkts: Tot Fwd Pkts
  bwd_pkts: Tot Bwd Pkts
  syn: SYN Flag Cnt
  ack: ACK Flag Cnt
  fin: FIN Flag Cnt
  rst: RST Flag Cnt
  psh: PSH Flag Cnt
  urg: URG Flag Cnt
  iat_mean: Flow IAT Mean
  iat_std: Flow IAT Std
  iat_max: Flow IAT Max
  init_win_fwd: Init Fwd Win Byts
  init_win_bwd: Init Bwd Win Byts
  label: Label

anonymisation:
  method: hmac_sha256               # keyed HMAC pseudonyms; the key is never committed
  key_env_var: SIH26_HMAC_KEY
  per_epoch_permutation: true       # re-permute node ids every epoch (anti-memorisation)
  node_features: role_only          # internal/external, /24 bucket, server-like port profile
  heldout_attacker_ip_eval: false   # M1.7 evaluation mode switch
  internal_networks:                # the CIC testbed + RFC1918 space
    - 172.31.0.0/16
    - 10.0.0.0/8
    - 192.168.0.0/16
  n_net24_buckets: 256
  server_ports: [20, 21, 22, 23, 25, 53, 80, 110, 143, 443, 445, 993, 995, 3306, 3389, 8080]

packet_features:
  # Output keyed on (src_ip, window_id); joins onto flow features (M2).
  fields:
    - ttl_mean
    - ttl_var
    - tcp_win_mean
    - tcp_win_var
    - frag_flag_count
    - payload_hist_0
    - payload_hist_1
    - payload_hist_2
    - payload_hist_3
    - payload_hist_4
    - payload_hist_5
    - payload_hist_6
    - payload_hist_7
    - distinct_dst_ports
    - sequential_port_ratio
    - port_entropy
    - retransmission_count
  payload_hist_bin_edges: [0, 64, 128, 256, 512, 1024, 1460, 8192]
  retransmission_backend: scapy     # tshark | scapy (must agree on the fixture; tshark
                                    # path activates once Wireshark is installed - M2.2)
  retrans_track_per_flow: 4096      # per-flow seq cache size for the scapy heuristic
  tshark_path: null                 # null = auto-discover (PATH, then the default
                                    # C:/Program Files/Wireshark/tshark.exe)

flows:
  timeout_seconds: 120              # idle gap that splits a 5-tuple into a new flow
  missing_init_win: -1              # value when no SYN / SYN-ACK window was seen
