# GRAFT encoder training configuration (M6).

seed: 1337

model:
  d_model: 128
  layers: 2
  heads: 4
  ffn_dim: 256
  dropout: 0.1
  causal: true            # the encoder is causal; bidirectional is a bug, not a choice
  time2vec_dim: 8
  # M6.2 verdict, revised by the root-cause diagnosis (diagnosis_report.md §3,6):
  # UNBOUNDED Time2Vec hurt (its linear term grows without limit in the
  # inter-window gap and swamps the features after idle gaps), but Time2Vec
  # CLAMPED at the p95 real gap helps decisively on the test family — see
  # configs/train_graft_t2v_clamped.yaml (F1 0.371 -> 0.480, 1/2 -> 2/2
  # episodes, both seeds). It still ships OFF here because the clamped variant
  # trails no-T2V on the VAL day (0.66-0.69 vs 0.822 AUROC, two seeds) and
  # promotion is val-selected; flip only with a val-justified ablation row.
  use_time2vec: false

heads:
  attack_prob: true
  stage_classes: 7        # must equal len(stages) in data.yaml
  evidential: dirichlet   # Sensoy et al. 2018 — never Normal-Inverse-Gamma
  reconstruction: true    # trained on benign windows only (masked loss) as the OOD signal

loss:
  # Composite loss weights (M6.5); class weights computed from the train split.
  w_attack: 1.0
  w_stage: 1.0
  w_evidential: 1.0
  w_reconstruction: 0.5
  evidential_kl_anneal_epochs: 10
  class_weighting: inverse_frequency

optim:
  lr: 0.0003
  weight_decay: 0.00001
  batch_size: 64
  epochs: 8              # CPU-sized (this laptop has no GPU); revisit if underfit
  grad_clip: 1.0
  early_stop_patience: 7
