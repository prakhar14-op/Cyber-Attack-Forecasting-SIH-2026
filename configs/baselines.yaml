# Baseline model hyper-parameters (M4.3). No magic numbers in code.

seed: 1337

models:
  lr:
    C: 1.0
    max_iter: 500
    solver: lbfgs          # class_weight=balanced is set in code (PS-mandated)

  xgb:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8

  lstm:
    hidden_dim: 64
    layers: 1
    dropout: 0.0
    lr: 0.003
    epochs: 15
    grad_clip: 1.0
    batch_size: 256
